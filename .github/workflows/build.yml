
name: Build Minecraft Mod

on:
  workflow_dispatch:
  push:
    paths:
      - '**.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract mod source
        run: |
          ZIP=$(find . -maxdepth 1 -type f -name '*.zip' | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "Source ZIP not found"
            exit 1
          fi
          mkdir project
          unzip -q "$ZIP" -d project
          BUILD_FILE=$(find project -type f -name build.gradle -print -quit)
          if [ -z "$BUILD_FILE" ]; then
            echo "build.gradle not found"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$BUILD_FILE")" >> "$GITHUB_ENV"

      - name: Build mod JAR
        run: gradle --no-daemon build
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: MineArea-Fabric-1.21.11
          path: ${{ env.PROJECT_DIR }}/build/libs/*.jar
          
