name: Build MineArea

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.0'

      - name: Extract source
        run: |
          unzip -o MineArea-Fabric-1.21.11-source.zip -d project

      - name: Build mod
        working-directory: project/MineArea-Fabric-1.21.11
        run: gradle build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: MineArea-JAR
          path: project/MineArea-Fabric-1.21.11/build/libs/*.jar
          if-no-files-found: error
